# 同步上游 + 自动构建 + 发布 Release（全程在 GitHub runner 上，本地不参与）
#
# 设计参考了 xiaoxun007/NexioSchedule 的做法，但有两处**必须不同**：
#   1) 签名密钥：本 fork 用**自己的 keystore**（放 repo secrets，绝不入库），
#      这样能直接覆盖安装你手机上现有那版；参考仓库用的是可公开的 debug key。
#   2) 同步方式：**合并式 fork** —— `master` 就是发布分支（= 上游 + 本 fork 的定制提交），
#      CI 直接构建它，不再"钉住旧基准 + 重放补丁"：
#          · 定时 / 手动触发 → 上游有新提交就先自动 `git merge upstream/master`；
#          · 合并干净且没命中「分歧清单」→ 构建 → 门禁/契约/签名全绿 → **才**推 master、才发版
#            （顺序刻意如此：远端 master 永远不会前进到一个"构建不过"的状态）；
#          · 合并冲突 → `merge --abort`，**什么都不推**，本次仍用旧 master 出包，另开 Issue 等人工处理。
#      `patches/` 与 `tools/check_patches.py` 是旧机制（钉基准 + 重放补丁）的留档，已不参与构建。
#
# 首次使用：先把 4 个 secrets 配好（见 README「自动构建」一节），再手动 Run 一次。

name: 同步上游并构建 Release APK

on:
  schedule:
    - cron: '0 */6 * * *'      # 每 6 小时自动跟一次上游：能干净合并就构建+发版，冲突/命中清单只开 Issue
  workflow_dispatch:
    inputs:
      dry_run:
        description: '只构建不发布（改定制 / 验 CI 时用：跑完守卫就停，不占版本号、不产生 Release）'
        type: boolean
        default: false

permissions:
  contents: write              # 发 Release / 推送 master 同步
  issues: write                # 失败时开 Issue 提醒

# 同一个 ref 同时只跑一个；重复触发自动取消旧的（省额度）
concurrency:
  group: sync-build-${{ github.ref }}
  cancel-in-progress: true

# 【合并式 fork】不再钉上游基准：master = 上游 + 本 fork 的定制提交，
# 上游用 `git merge upstream/master` 并入（见「合并上游到 master」那一步）。
# 所以这里**故意没有 UPSTREAM_BASE** —— 旧机制（钉死基准 + 重放补丁）已退役：
# 升上游不必再改 workflow、不必重新生成补丁，只需要处理（可能的）合并冲突。

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（完整历史）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 配置 git 并拉取上游
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/HaoZai000/NexioSchedule.git
          git fetch upstream master

      - name: 判断上游是否有新提交
        id: check
        run: |
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
            echo "✅ 已是最新上游，无需构建"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$(git rev-parse --short upstream/master)" >> "$GITHUB_OUTPUT"
            echo "🔄 检测到上游新提交 $(git rev-parse --short upstream/master)"
          fi

      - name: 合并上游到 master（合并式 fork：冲突就停，不动现有构建）
        id: merge
        run: |
          # 合并式同步：master = 上游 + 本 fork 的定制提交。
          # ★ 冲突时 abort 且**不推任何东西** —— 远端 master 保持可用，
          #   本次仍用旧 master 出包（不断供），另开 Issue 请人工处理。
          # ★ 合并结果只存在于本 runner 的工作区，直到「推送 master」那一步才回写远端。
          echo "merged=false" >> "$GITHUB_OUTPUT"
          echo "conflict=false" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.check.outputs.has_update }}" != "true" ]; then
            echo "上游无新提交，跳过合并（直接构建当前 master）"
            exit 0
          fi
          # ★ 只 merge 一次并抓下输出：原来在冲突分支里又 merge 了一次（多余，且会二次改动工作区）
          if OUT=$(git merge --no-edit upstream/master 2>&1); then
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "✅ 合并干净；本次带入的上游改动："
            printf '%s\n' "$OUT" | grep -E 'files? changed|insertions' | head -2 || true
            git log --no-merges --format='- %s' HEAD^1..HEAD | head -20 || true
          else
            printf '%s\n' "$OUT" | grep -E '^CONFLICT|^Auto-merging' | head -30 > /tmp/conflict.txt || true
            git merge --abort 2>/dev/null || true
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "本次合并冲突（下面这些文件两边都改了）："
            cat /tmp/conflict.txt
            echo "::warning::上游改了同一处代码，合并冲突 —— 远端 master 保持不变（本次仍用旧 master 构建），另开 Issue 等人工处理"
          fi

      - name: 分歧清单守卫｜命中就只验证不自动发版
        id: watch
        run: |
          # tools/divergence-watch.txt 列出「我们故意跟上游不一样」的地方
          #（备份语义、毛玻璃系数、分钟节拍、岛 B 区联动 …）。
          # 合并一旦碰到这些文件，说明上游很可能又动了那块 ——
          # 这种改动**必须人工过一眼**，否则会把我们的取舍悄悄翻回去。
          echo "blocked=false" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.merge.outputs.merged }}" != "true" ]; then
            echo "本次没有合并，跳过清单检查"; exit 0
          fi
          if [ ! -f tools/divergence-watch.txt ]; then
            echo "没有清单文件，跳过"; exit 0
          fi
          MAP=$(grep -v '^#' tools/divergence-watch.txt | grep -v '^[[:space:]]*$' || true)
          if [ -z "$MAP" ]; then echo "清单为空，跳过"; exit 0; fi
          HIT=$(git diff --name-only HEAD~1 HEAD | grep -xF -f <(printf '%s\n' "$MAP") || true)
          if [ -n "$HIT" ]; then
            echo "blocked=true" >> "$GITHUB_OUTPUT"
            echo "::warning::命中「故意分歧清单」，本次只验证不自动发版："
            printf '%s\n' "$HIT"
          else
            echo "✅ 未命中分歧清单"
          fi

      - name: 质量门禁｜不变量核对（不过就不发版）
        if: github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true'
        run: |
          # 这些条目全部来自本地踩过的坑（岛 B 区联动 / 折射宽度恒定 / 日子词唯一 /
          # 次日文案共享 / 余额最后一天 / sectionTopDp 单一真源 / 下载源只认带包的版本 …）。
          #
          # ★ 必须 set -o pipefail：bash 里管道的退出码是**最后一个命令**的，
          #   写成 `python3 ci_check.py . | tee log` 时 python 的失败会被 tee 吞掉、步骤照样绿
          #   —— 这门禁曾经因此一路空转、看着全绿。
          # ★ 合并式 fork 下，检出的工作树**就是要发布的那份 master**，所以直接用树里的脚本；
          #   不再 `git archive origin/master tools`：那样在"拿别的 ref 预演这个 workflow"时
          #   会偷偷跑 master 上的另一份脚本，预演就不作数了。
          set -euo pipefail
          GATE="$(pwd)/tools/ci_check.py"
          if [ ! -f "$GATE" ]; then
            echo "::error::工作树里没有 tools/ci_check.py —— 门禁脚本缺失，直接挡住发版（宁可不发，也不要假绿灯）"
            exit 1
          fi
          echo "门禁脚本: $GATE"
          python3 "$GATE" . | tee /tmp/ci_check.log

      - name: 守卫｜凭据外泄扫描（源码 / 提交信息里不该出现任何密钥）
        # 本仓库的 CI 握着 keystore（base64）+ 两个口令 + alias + 一个 Gitee token，
        # 一旦写进源码 / workflow / commit message / 日志，就等于把签名权和发布权交出去。
        # 同一个脚本（tools/check_secrets.py）本地推之前也会跑；这里再挡一道，
        # 防止"自动合并进来的东西"或以后的改动把凭据带进仓库。
        # 只扫工作区 + 跟踪文件 + 提交信息（全历史对象扫描更慢，发布前本地用 --objects 跑）。
        # 输出只给类型和位置、命中片段一律打码，不会把凭据本体写进日志。
        if: github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true'
        run: |
          python3 tools/check_secrets.py --tree --tracked --messages

      - name: 设置 JDK 21
        if: github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 缓存（CI 提速）
        if: github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: false

      - name: 安装 Android SDK（platform/build-tools 37）
        if: github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true'
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: 准备签名材料（上游新版 build.gradle.kts 在**构建期**就要 keystore）
        # 上游 9ea4e54d 起，app/build.gradle.kts 加了 signingConfigs.release：
        #   storeFile 默认 ../keystore/nexio-release.jks（相对 app 模块 = 仓库根 keystore/），
        #   并把 debug / release 两个 buildType 都挂上了它。缺文件时 :app:validateSigningRelease
        #   会让 assembleRelease 直接失败（我们就是这么红了一次 —— 代码本身没问题）。
        # 所以：**构建之前**就把本 fork 的 keystore 放好，并用 keystore.properties
        #   （上游用 rootProject.file 读它，且已在 .gitignore 忽略）覆盖路径/口令，
        #   让 AGP 直接签出正式包 —— 证书仍是本 fork 的，覆盖安装不受影响。
        if: github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::缺少 secrets.KEYSTORE_BASE64 —— 请按 README「自动构建」一节配置 4 个 secrets 后再运行"
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KS_B64" | base64 -d > signing/fork.jks
          chmod 600 signing/fork.jks
          # 值里若含反斜杠会被 java.util.Properties 当转义符 —— 先转义再写
          esc() { printf '%s' "$1" | sed 's/\\/\\\\/g'; }
          {
            echo "storeFile=../signing/fork.jks"
            echo "storePassword=$(esc "$KS_PASS")"
            echo "keyAlias=$(esc "$KEY_ALIAS")"
            echo "keyPassword=$(esc "$KEY_PASS")"
          } > keystore.properties
          echo "keystore.properties 已写入（storeFile=../signing/fork.jks；别名与口令一律不回显）"

      - name: 计算 fork 版本号并构建
        id: build
        if: github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CI 在云端，用官方 Gradle 源（仓库里的 wrapper 指向的是国内镜像）
          sed -i 's#distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-9.5.1-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties
          VNAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          MAINVER=$(echo "$VNAME" | sed 's/-.*//')
          VC=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          # 序号 = **全仓库**历史 gh 发布数 + 1（不是"同 MAINVER 下的第几个"）。
          #   为什么要全局计数：分母用 MAINVER 的话，基准一升级（1.5.6 → 1.6.0.1）
          #   计数会从 5 掉回 0，FORK_CODE = VC*100+1 = 15601 < 已有的 15605，
          #   既触发不了"覆盖安装"，也会被下面的单调性守卫拦下。全局计数天然单调。
          GH_COUNT=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq '.[].tag_name' 2>/dev/null | sed 's/.*-gh//' | grep -cE '^[0-9]+$' || true)
          GH_N=$((GH_COUNT + 1))
          FORK_CODE=$((VC * 100 + GH_N))
          # 版本号用第 4 段递增：1.5.6.1-gh1 / 1.5.6.2-gh2 …
          # 这样 App 的更新检查（比较数字段）才能认出"有新版"，同时 MAJOR.MINOR.PATCH 与上游保持对齐。
          FORK_VER="${MAINVER}.${GH_N}-gh${GH_N}"
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${FORK_VER}\"/" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = ${FORK_CODE}/" app/build.gradle.kts
          {
            echo "MAINVER=$MAINVER"; echo "VNAME=$VNAME"; echo "VC=$VC"
            echo "GH_N=$GH_N";     echo "FORK_CODE=$FORK_CODE"; echo "FORK_VER=$FORK_VER"
          } >> "$GITHUB_OUTPUT"
          echo "本次构建：${FORK_VER}（versionCode=${FORK_CODE}，上游 ${VNAME}/${VC}）"
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: 整理产物（AGP 已用 fork keystore 签好；上游若没有 signingConfig 则回退本地签名）
        if: github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true'
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT="$SDK_ROOT/build-tools/37.0.0"
          mkdir -p app/build/outputs/final
          APK_NAME="Nexio.v${{ steps.build.outputs.FORK_VER }}.apk"
          OUT="app/build/outputs/final/$APK_NAME"
          SRC="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$SRC" ]; then
            echo "✅ 构建期已签名（上游 signingConfigs.release + 本 fork 的 keystore）"
          else
            SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
            echo "::warning::上游没有 release signingConfig —— 回退到本地 zipalign + apksigner"
            "$BT/zipalign" -f 4 "$SRC" app/build/outputs/final/aligned.apk
            "$BT/apksigner" sign --ks signing/fork.jks --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "$OUT" app/build/outputs/final/aligned.apk
            SRC="$OUT"
          fi
          # ★ 只做对齐检查，绝不 zipalign 已签名的包（签完再对齐会破坏 v2/v3 签名）
          "$BT/zipalign" -c 4 "$SRC" || echo "::warning::zipalign -c 未通过（AGP/上游产物默认已对齐，仅提示）"
          "$BT/apksigner" verify --print-certs "$SRC" | head -6
          cp -f "$SRC" "$OUT"
          ( cd app/build/outputs/final && sha256sum "$APK_NAME" > "$APK_NAME.sha256" && cat "$APK_NAME.sha256" )
          ls -lh app/build/outputs/final/

      - name: 可选｜wear 变体签名（与手表 rpk 同证书；配了 WEAR_KEYSTORE_BASE64 才出）
        # ★ 非致命：这一步失败**不影响普通包发布**（手机照常能收到更新），
        #   下面契约核验会按"配了却没产出"给出明确告警。
        continue-on-error: true
        # 为什么要有它：小米穿戴的 interconnect 在**商店签名包**那一套里要求
        #   手表 rpk 与手机 APK **同包名且同签名**（见 WearableScheduleSync 的注释）。
        #   本 fork 的普通包用自己的 keystore（为了能覆盖安装你现在手机上那版），
        #   证书与手表那把不一致 —— 于是同一个 Release 里再放一个 `...-wear.apk`：
        #   **内容完全相同的同一次构建**，只用「与手表 rpk 同一把」keystore 重签。
        # 没配 WEAR_* secrets 就跳过：流水线照常出普通包，不会因此变红。
        # ★ 重签前必须先 zipalign（它会重写 zip、顺带去掉 AGP 的 v2/v3 签名块）；
        #   签完再对齐会破坏签名，所以这里的顺序不能反。
        if: github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true'
        env:
          WKS_B64: ${{ secrets.WEAR_KEYSTORE_BASE64 }}
          WKS_PASS: ${{ secrets.WEAR_KEYSTORE_PASSWORD }}
          WKEY_ALIAS: ${{ secrets.WEAR_KEY_ALIAS }}
          WKEY_PASS: ${{ secrets.WEAR_KEY_PASSWORD }}
        run: |
          if [ -z "$WKS_B64" ]; then
            echo "未配置 WEAR_KEYSTORE_BASE64 —— 本次只出普通变体（手表互联若需要 wear 变体，见 README）"
            exit 0
          fi
          BT="$SDK_ROOT/build-tools/37.0.0"
          mkdir -p signing app/build/outputs/final
          printf '%s' "$WKS_B64" | base64 -d > signing/wear.jks
          chmod 600 signing/wear.jks
          SRC="app/build/outputs/apk/release/app-release.apk"
          [ -f "$SRC" ] || SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
          WEAR="app/build/outputs/final/Nexio.v${{ steps.build.outputs.FORK_VER }}-wear.apk"
          "$BT/zipalign" -f 4 "$SRC" app/build/outputs/final/wear-aligned.apk
          "$BT/apksigner" sign --ks signing/wear.jks --ks-key-alias "$WKEY_ALIAS" \
            --ks-pass env:WKS_PASS --key-pass env:WKEY_PASS \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$WEAR" app/build/outputs/final/wear-aligned.apk
          "$BT/apksigner" verify --print-certs "$WEAR" | head -6
          ( cd app/build/outputs/final && sha256sum "$(basename "$WEAR")" > "$(basename "$WEAR").sha256" && cat "$(basename "$WEAR").sha256" )
          echo "✅ wear 变体已生成（与普通包同一次构建、同版本号，只换签名）"

      - name: 守卫｜APK 契约核验（签名指纹 / 版本号 / 单调递增）
        if: github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT_CERT: a7fdc7b704db284774a0124fb13495b5e6ee4a05f6430547ad8ec21aba5ac938
        run: |
          APK="app/build/outputs/final/Nexio.v${{ steps.build.outputs.FORK_VER }}.apk"
          BT="$SDK_ROOT/build-tools/37.0.0"
          # ① 签名指纹必须与"手机上现有那版"一致（否则装了也不能覆盖升级）
          CERT=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 -i 'SHA-256 digest' | sed 's/.*digest: //')
          if [ "$CERT" != "$EXPECT_CERT" ]; then
            echo "::error::签名指纹不符：期望 $EXPECT_CERT，实际 $CERT（secrets 里的 keystore 是不是换过？）"
            exit 1
          fi
          echo "✅ 签名指纹一致：$CERT"
          # ② 包内版本号必须等于本次算出的值（防止 sed 版本号没生效）
          # 用 build-tools 的 aapt2 读包内版本号（apkanalyzer 在 runner 上不保证存在；
          # 且 platformBuildVersionCode 也会被贪婪匹配到，所以只取第一处 versionCode）
          PKG=$("$BT/aapt2" dump badging "$APK" | grep -m1 '^package:')
          BADGING=$(printf '%s' "$PKG" | grep -o "versionName='[^']*'" | head -1 | cut -d"'" -f2)
          VCODE=$(printf '%s' "$PKG" | grep -o "versionCode='[0-9]*'" | head -1 | cut -d"'" -f2)
          echo "包内：versionName=$BADGING versionCode=$VCODE"
          if [ "$BADGING" != "${{ steps.build.outputs.FORK_VER }}" ]              || [ "$VCODE" != "${{ steps.build.outputs.FORK_CODE }}" ]; then
            echo "::error::包内版本号与预期不符（预期 ${{ steps.build.outputs.FORK_VER }} / ${{ steps.build.outputs.FORK_CODE }}）"
            exit 1
          fi
          # ③ versionCode 必须严格大于所有已发版本（保证能直接覆盖安装）
          MAX=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 2>/dev/null | awk '{print $1}' | head -0; true)
          MAX=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name' 2>/dev/null                 | sed 's/.*-gh//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          MAX=${MAX:-0}
          N=${{ steps.build.outputs.GH_N }}
          if [ "$N" -le "$MAX" ]; then
            echo "::error::序号 $N 不大于历史最大值 $MAX —— versionCode 会与旧版冲突"
            exit 1
          fi
          echo "✅ versionCode 单调：本次 ${{ steps.build.outputs.FORK_CODE }}（序号 $N > 历史 $MAX）"

          # ④ wear 变体（如果这次出了）：必须与普通包**同版本号**、但**不同证书**。
          #    同证书 = 根本没换 keystore，变体就白做了；不同版本号 = 两个包不是同一次构建。
          WEAR_APK="app/build/outputs/final/Nexio.v${{ steps.build.outputs.FORK_VER }}-wear.apk"
          if [ -f "$WEAR_APK" ]; then
            WCERT=$("$BT/apksigner" verify --print-certs "$WEAR_APK" | grep -m1 -i 'SHA-256 digest' | sed 's/.*digest: //')
            if [ "$WCERT" = "$CERT" ]; then
              echo "::error::wear 变体的证书与普通包相同 —— 说明没用 wear keystore 签，变体没意义"
              exit 1
            fi
            WPKG=$("$BT/aapt2" dump badging "$WEAR_APK" | grep -m1 '^package:')
            WBADGING=$(printf '%s' "$WPKG" | grep -o "versionName='[^']*'" | head -1 | cut -d"'" -f2)
            WVCODE=$(printf '%s' "$WPKG" | grep -o "versionCode='[0-9]*'" | head -1 | cut -d"'" -f2)
            if [ "$WBADGING" != "${{ steps.build.outputs.FORK_VER }}" ] || [ "$WVCODE" != "${{ steps.build.outputs.FORK_CODE }}" ]; then
              echo "::error::wear 变体版本号与普通包不一致（$WBADGING / $WVCODE）—— 不是同一次构建"
              exit 1
            fi
            echo "✅ wear 变体：证书 $WCERT（与普通包不同 ✓）版本 $WBADGING/$WVCODE（与普通包一致 ✓）"
          elif [ "${{ secrets.WEAR_KEYSTORE_BASE64 != '' }}" = "true" ]; then
            echo "::warning::配置了 WEAR_KEYSTORE_BASE64 却没产出 wear 变体 —— 看上面「可选｜wear 变体签名」的日志（普通包已正常发出，不影响手机更新）"
          else
            echo "本次没有 wear 变体（未配置 WEAR_* secrets），跳过"
          fi

      - name: 推送 master（只有"合并干净 + 未命中分歧清单 + 非 dry_run"才推）
        # ★ 顺序刻意如此：先合并 → 再构建与全部门禁/契约核验 → **最后才推 master**。
        #   这样远端 master 永远不会指向一个"构建不过"的树；冲突时 merged=false，同样不推。
        if: steps.merge.outputs.merged == 'true' && steps.watch.outputs.blocked != 'true' && inputs.dry_run != true
        run: |
          git push origin HEAD:master
          echo "✅ master 已前进到 $(git rev-parse --short HEAD)（已含本次合并进来的上游提交）"

      - name: 上传构建产物（Actions 页面可下载）
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Nexio-fork-release-${{ steps.build.outputs.FORK_VER }}
          path: app/build/outputs/final/Nexio.v*.apk*

      - name: 发布 GitHub Release
        # dry_run=true = 只验证构建与守卫，不发版、不占版本号（改定制 / 验 CI 时先用它验证）
        if: (github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true') && steps.watch.outputs.blocked != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.build.outputs.FORK_VER }}"
          UP_SHORT=$(git rev-parse --short upstream/master)
          MERGED="${{ steps.merge.outputs.merged }}"
          if [ "$MERGED" = "true" ]; then
            UP_TITLE="### 🔄 本次并入的上游提交"
            UP_LOG=$(git log --no-merges --format='- %s' HEAD^1..HEAD | head -20)
          else
            UP_TITLE="### 🔄 上游合并情况"
            UP_LOG="（本次没有新上游提交，按当前 master 出包）"
          fi
          CUSTOM_LOG=$(git log upstream/master..HEAD --no-merges --format='- %s' | head -40)
          CERT=$("$SDK_ROOT/build-tools/37.0.0/apksigner" verify --print-certs \
            "app/build/outputs/final/Nexio.v${{ steps.build.outputs.FORK_VER }}.apk" 2>/dev/null \
            | grep -m1 -i 'SHA-256 digest' | sed 's/.*digest: //')
          cat > /tmp/notes.md << MDEOF
          ### 📦 构建信息
          - **上游版本**：HaoZai000/NexioSchedule@${UP_SHORT}（上游 versionName \`${{ steps.build.outputs.VNAME }}\` / versionCode \`${{ steps.build.outputs.VC }}\`）
          - **本 fork 版本**：\`${TAG}\`（versionName \`${{ steps.build.outputs.FORK_VER }}\` / versionCode \`${{ steps.build.outputs.FORK_CODE }}\`）
          - **签名证书 SHA-256**：\`${CERT}\`
          - **构建方式**：GitHub Actions 全程构建（本地不参与）；合并式 fork —— 直接构建 master（上游 + 定制提交）

          ${UP_TITLE}
          ${UP_LOG}

          ### 🧩 本 fork 的定制提交（master 上、上游没有的）
          ${CUSTOM_LOG}

          ### ✅ 自动核验（均由 CI 完成，不通过就不会发出来）
          - 质量门禁 \`tools/ci_check.py\`：全部通过
          - 签名指纹与目标 keystore 一致、包内版本号与上述一致、序号单调递增
          - 已生成同名 \`.sha256\` 校验文件

          ### 📱 两个变体，按需选一个
          - **普通版** \`Nexio.v…-gh….apk\`：本 fork 自己的证书 —— 能**直接覆盖安装**你现在手机上的 fork 版；
          - **wear 版** \`Nexio.v…-gh…-wear.apk\`（本次若提供）：与**手表 rpk 同一把**证书，用于小米穿戴互联。
            它与普通版**不能互相覆盖安装**（签名不同），App 内更新会按自身签名自动只取对应变体。
          - 两个变体是**同一次构建**（版本号完全相同），只是签名不同。

          ### ⚠️ 安装注意
          - 本 fork 用自己的 keystore 签名：**从上游原版切过来需要先卸载**（会丢 App 内数据，建议先做一次 WebDAV 备份）；
          - **同一 fork 系列可直接覆盖安装**（versionCode 单调递增：上游码×100 + 序号）；
          - 校验：下载后比对同名 \`.sha256\`（\`sha256sum -c\` 即可）。
          MDEOF
          gh release create "$TAG" app/build/outputs/final/Nexio.v*.apk app/build/outputs/final/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file /tmp/notes.md \
            || echo "Release 已存在或创建失败（忽略）"

      - name: 合并冲突 / 命中分歧清单时开 Issue（不阻塞已有 master）
        continue-on-error: true
        if: steps.merge.outputs.conflict == 'true' || steps.watch.outputs.blocked == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONFLICT="${{ steps.merge.outputs.conflict }}"
          BLOCKED="${{ steps.watch.outputs.blocked }}"
          EXIST=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "上游合并需要人工处理" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$EXIST" != "0" ]; then echo "已有同类 Issue（#$EXIST），跳过"; exit 0; fi
          {
            if [ "$CONFLICT" = "true" ]; then
              echo "## ⚠️ 上游改了同一处代码，自动合并冲突（已 abort，远端 master 未变）"
              echo
              echo "本次仍用**旧 master** 构建出包（不会断供），但新上游没并进来。改法（**不用本地编译**，CI 会编译）："
              echo
              echo '```'
              echo "git fetch origin master && git checkout master && git pull"
              echo "git remote add upstream https://github.com/HaoZai000/NexioSchedule.git   # 若还没加"
              echo "git fetch upstream master && git merge upstream/master"
              echo "# 手工解冲突 → git add … → git commit → git push origin master"
              echo "# 然后手动 Run 一次本 workflow 出包"
              echo '```'
              echo
              echo "冲突文件（两边都改过的）："
              echo '```'
              head -30 /tmp/conflict.txt 2>/dev/null || echo "(没抓到清单，请看运行日志)"
              echo '```'
            fi
            if [ "$BLOCKED" = "true" ]; then
              echo "## 🚦 本次合并碰到了「故意与上游分歧」的文件"
              echo
              echo "\`tools/divergence-watch.txt\` 里列的都是本 fork **故意**跟上游不一样的地方"
              echo "（备份语义、毛玻璃系数、分钟节拍、岛 B 区联动 …）。上游一改这些文件，"
              echo "自动合并就有可能把我们的取舍悄悄翻回去 —— 所以这次**只验证、不发版**。"
              echo
              echo "请人工过一眼这些文件的 diff，确认取舍没被翻掉后，手动 Run 一次本 workflow 即可正常发版。"
            fi
          } > /tmp/issue.md
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "上游合并需要人工处理：$(date +%F)" --body-file /tmp/issue.md || true

      - name: 同步发布到 Gitee（可选：配了 GITEE_TOKEN 才执行）
        # 非关键路径：Gitee 抖动不该让整条流水线红叉（GitHub 那边已经发好了）
        continue-on-error: true
        if: (github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true') && steps.watch.outputs.blocked != 'true' && inputs.dry_run != true
        env:
          GT: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          if [ -z "$GT" ] || [ -z "$GITEE_REPO" ]; then
            echo "未配置 GITEE_TOKEN / GITEE_REPO，跳过 Gitee 同步（不影响 GitHub 发布）"
            exit 0
          fi
          TAG="v${{ steps.build.outputs.FORK_VER }}"
          # 附件 = 本地产出的**全部** APK（普通 + 可能的 wear 变体）
          APKS=$(ls app/build/outputs/final/Nexio.v*.apk 2>/dev/null || true)
          APK_N_LOCAL=$(printf '%s\n' "$APKS" | grep -c '\.apk$' || true)
          echo "本地待上传 APK（$APK_N_LOCAL 个）："; printf '%s\n' "$APKS"
          API="https://gitee.com/api/v5/repos/$GITEE_REPO"
          echo "同步到 Gitee: $GITEE_REPO $TAG"
          # 建 release（已存在则取回 id）
          #
          # 踩过的坑（这就是"Gitee 从来没有自动同步"的根因）：
          #   1) Gitee 建 release **必须传 target_commitish**，否则 400 target_commitish is missing；
          #   2) 兜底查询 /releases/tags/{tag} 在不存在时返回 HTTP 200 + body `null`，
          #      直接 `.get('id')` 会抛异常并把真实错误吞掉（日志只剩一句 warning）。
          # 现在：显式传 target_commitish、解析时判 null、失败时把**原始响应**打出来。
          RESP=$(curl -s -X POST "$API/releases" \
            --data-urlencode "access_token=$GT" \
            --data-urlencode "tag_name=$TAG" \
            --data-urlencode "name=$TAG" \
            --data-urlencode "target_commitish=master" \
            --data-urlencode "body=本包与 GitHub Release 同一构建产物：https://github.com/${{ github.repository }}/releases/tag/$TAG")
          RID=$(printf '%s' "$RESP" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('id','') if isinstance(d,dict) else '')" 2>/dev/null || true)
          if [ -z "$RID" ]; then
            echo "::warning::Gitee release 创建失败，原始响应：$RESP"
            RESP2=$(curl -s "$API/releases/tags/$TAG?access_token=$GT")
            RID=$(printf '%s' "$RESP2" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('id','') if isinstance(d,dict) else '')" 2>/dev/null || true)
            [ -n "$RID" ] || echo "::warning::按 tag 查也拿不到 id，原始响应：$RESP2"
          fi
          if [ -z "$RID" ]; then echo "::warning::Gitee release 创建/查询失败，跳过附件上传"; exit 0; fi
          # 上传附件并**核验真的挂上了**。
          #
          # 为什么必须核验（真机踩过）：Gitee 建 release 时会自动挂上源码 zip，
          # 而 .apk 是这一步之后才 attach 上去的，实测两者相差 8 分钟。
          # 这段窗口里"最新 release"是个**没有安装包**的版本 —— App 选中它，
          # 下载按钮就只会弹「未找到下载链接」。所以：
          #   · 上传失败必须重试（跨国上传会抖）；
          #   · 三次都不行就**删掉这条 release**，宁可"暂时没有新版"，
          #     也不要留一个"最新但没包"的坑（App 侧虽已只认带包的版本，这是双保险）。
          echo "Gitee release id=$RID，上传附件…"
          ATTACHED=0
          for attempt in 1 2 3; do
            for f in $APKS; do
              curl -s -X POST "$API/releases/$RID/attach_files" \
                -F "access_token=$GT" -F "file=@$f" -o /tmp/attach.json || true
              head -c 120 /tmp/attach.json; echo
            done
            APK_N=$(curl -s "$API/releases/$RID?access_token=$GT" | python3 -c "import json,sys;d=json.load(sys.stdin);print(sum(1 for a in (d.get('assets') or []) if str(a.get('name','')).endswith('.apk')) if isinstance(d,dict) else 0)" 2>/dev/null || echo 0)
            # 核验：附件数必须**不少于本地产出数**（普通 + wear 都要挂上；Gitee 上传会抖，所以重试）
            if [ "${APK_N:-0}" -ge "${APK_N_LOCAL:-1}" ]; then ATTACHED=1; echo "  核验：Gitee 上有 $APK_N 个 .apk 附件（本地 $APK_N_LOCAL 个，第 $attempt 次）"; break; fi
            echo "::warning::第 $attempt 次上传后仍看不到 .apk 附件，5 秒后重试…"
            sleep 5
          done
          if [ "$ATTACHED" != "1" ]; then
            echo "::error::Gitee .apk 附件上传失败 —— 删除这条 release，避免 App 选中「最新但没有安装包」的版本"
            curl -s -X DELETE "$API/releases/$RID?access_token=$GT" | head -c 200; echo
            exit 1
          fi
          echo "✅ Gitee 附件上传完成并已核验（.apk 在附件里）"

      - name: 同步代码到 Gitee（可选：镜像 master 与源码分支）
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || steps.merge.outputs.merged == 'true'
        env:
          GT: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          if [ -z "$GT" ] || [ -z "$GITEE_REPO" ]; then
            echo "未配置 GITEE_TOKEN / GITEE_REPO，跳过代码镜像"; exit 0
          fi
          GURL="https://oauth2:$GT@gitee.com/$GITEE_REPO.git"
          # ★ master 用**强制**推送：Gitee 侧只是镜像，一切以 GitHub 为准。
          #   合并式 fork 切换时 lineage 变过一次（旧的是"钉基准 + 重放补丁"形态），
          #   非强制推会一直 "non-fast-forward" 失败、只留一条 warning —— 镜像就悄悄烂在那儿了。
          if git push --force "$GURL" origin/master:refs/heads/master; then
            echo "✅ master 已镜像到 Gitee（强制：镜像以 GitHub 为准）"
          else
            echo "::warning::master 镜像失败（Gitee 侧权限或网络问题）"
          fi
          # 发布栈分支只是留档；上游删掉它/不存在也不算错
          if git push "$GURL" origin/local-audit-v21:refs/heads/local-audit-v21 2>/dev/null; then
            echo "✅ local-audit-v21 已镜像到 Gitee"
          else
            echo "（local-audit-v21 镜像跳过或失败，可忽略）"
          fi

      - name: 被取消/失败时清理「没有安装包」的 Gitee release
        # 真事：concurrency.cancel-in-progress 会在**下一轮 dispatch 时取消正在跑的这轮**，
        # 而 Gitee 建 release 与上传 .apk 之间有几秒~几分钟的窗口（跨国上传实测 8 分钟）。
        # 被取消就留下一条"有 release 却没有安装包"的记录 —— App 侧虽然会跳过它（v37 起只认带包的），
        # 但 Gitee 上那条会一直挂着，看着像"新版发不出来"。
        # 这里在取消/失败时把它删掉，保持「要么完整、要么没有」。
        continue-on-error: true
        if: cancelled() || failure()
        env:
          GT: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          set -uo pipefail
          VER="${{ steps.build.outputs.FORK_VER }}"
          if [ -z "$GT" ] || [ -z "$GITEE_REPO" ] || [ -z "$VER" ]; then
            echo "未配置 token / 没有算出版本号，跳过清理"; exit 0
          fi
          TAG="v$VER"
          API="https://gitee.com/api/v5/repos/$GITEE_REPO"
          RID=$(curl -s "$API/releases/tags/$TAG?access_token=$GT" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('id','') if isinstance(d,dict) else '')" 2>/dev/null || true)
          if [ -z "$RID" ]; then echo "Gitee 上没有 $TAG，无需清理"; exit 0; fi
          APK_N=$(curl -s "$API/releases/$RID?access_token=$GT" | python3 -c "import json,sys;d=json.load(sys.stdin);print(sum(1 for a in (d.get('assets') or []) if str(a.get('name','')).endswith('.apk')) if isinstance(d,dict) else 0)" 2>/dev/null || echo 0)
          if [ "${APK_N:-0}" = "0" ]; then
            echo "::warning::$TAG 在 Gitee 上没有 .apk（上传被中断），删除这条 release 以免留下半成品"
            curl -s -X DELETE "$API/releases/$RID?access_token=$GT" | head -c 200; echo
          else
            echo "$TAG 在 Gitee 上已带 .apk，保留"
          fi

      - name: 失败时开 Issue 提醒（同一类失败只留一条，后续追加评论）
        continue-on-error: true
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 为什么去重：按天开 Issue 的话，一次上游改动连红几轮就会堆一屏"自动构建失败"，
          # 真正要看的那条反而被淹没（实测一天堆了 3 条）。改成：
          # 已有同类未关 Issue 就追加一条评论（带本轮 run 链接），没有才新建。
          EXIST=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "自动构建失败 in:title" --json number --jq '.[0].number' 2>/dev/null || echo "")
          LINK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="本次 workflow 失败（多为**合并后的代码编译不过 / 门禁或契约核验不过**）。

          - 运行记录：${LINK}
          - 常见原因：① 上游删改了我们还在用的符号（合并"干净"不等于语义不冲突，
            典型症状是编译期 Unresolved reference）；② 上游改了**构建期**要求
            （例如新增 signingConfig，而 CI 里还没有 keystore）；
            ③ 门禁 tools/ci_check.py 或 APK 契约核验不通过。
          - 修好后推上 master（或直接手动 Run 一次），**只需改文件，不用本地编译**。
          - 远端 master 不受影响：本次失败不会推送任何东西。"
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --repo "$GITHUB_REPOSITORY" --body "又红了一轮：${LINK}" \
              || echo "追加评论失败（忽略）"
            echo "已在既有 Issue #$EXIST 追加评论，未新建"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "自动构建失败：$(date +%F)" --body "$BODY" || echo "开 Issue 失败（忽略）"
          fi
